name: mentalhealthmonitoringapp
description: "A Flutter application for mental health monitoring."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Form Validation
  email_validator: ^3.0.0
  flutter_form_builder: ^10.0.1

  # HTTP and Web
  http: ^1.2.2
  webview_flutter: ^4.2.4
  webview_flutter_web: ^0.2.2+4
  url_launcher: ^6.1.12

  # Charts and Data Visualization
  syncfusion_flutter_charts: ^30.2.4
  fl_chart: ^1.0.0
  agora_rtc_engine: ^6.2.1
  # Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.6.9

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  async: ^2.11.0
  logger: ^2.0.0

  # Video Conferencing & Permissions
  permission_handler: ^11.1.0

  # Additional UI Enhancements
  animated_text_kit: ^4.2.2
  lottie: ^2.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Add assets if you have any
  # assets:
  #   - images/
  #   - icons/